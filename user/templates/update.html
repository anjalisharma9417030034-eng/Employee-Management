
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Update Employee</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            min-height: 100vh;
            padding: 40px;
            color: #333;
            transition: 0.3s;
        }

        .container {
            max-width: 1100px;
            margin: auto;
        }

        /* Header */
        .header {
            background: white;
            padding: 25px;
            border-radius: 15px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
        }

        .header h1 {
            font-size: 28px;
            color: #333;
        }

        .header p {
            color: #777;
            margin-top: 5px;
        }

        /* Theme Button */
        .theme-btn {
            background: #34495e;
            color: white;
            padding: 10px 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            transition: 0.3s;
        }

        .theme-btn:hover {
            transform: translateY(-2px);
            opacity: 0.9;
        }

        /* Form Box */
        .form-container {
            background: white;
            padding: 30px;
            border-radius: 15px;
            max-width: 550px;
            margin: 40px auto;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            transition: 0.3s;
        }

        .form-container h2 {
            color: #34495e;
            margin-bottom: 25px;
            text-align: center;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            color: #555;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
            transition: 0.3s;
        }

        input:focus {
            border-color: #667eea;
            box-shadow: 0 0 5px rgba(102,126,234,0.4);
        }

        /* Buttons */
        .btn-submit {
            background: #3498db;
            color: white;
            padding: 12px 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            font-size: 15px;
            transition: 0.3s;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            opacity: 0.9;
        }

        .back-link {
            display: block;
            margin-top: 15px;
            text-align: center;
            color: #667eea;
            text-decoration: none;
            font-size: 14px;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        /* Dark Mode */
        body.dark {
            background: linear-gradient(135deg, #141e30, #243b55);
        }

        body.dark .header,
        body.dark .form-container {
            background: #1e293b;
            color: white;
        }

        body.dark .header h1,
        body.dark .form-container h2 {
            color: white;
        }

        body.dark .header p,
        body.dark label {
            color: #cbd5e1;
        }

        body.dark input {
            background: #334155;
            color: white;
            border-color: #475569;
        }

        body.dark input::placeholder {
            color: #cbd5e1;
        }

        body.dark .back-link {
            color: #93c5fd;
        }

        /* Responsive */
        @media (max-width: 700px) {
            body {
                padding: 15px;
            }

            .header {
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
            }

            .form-container {
                margin-top: 20px;
                padding: 20px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <!-- Header -->
    <div class="header">
        <div>
            <h1>👨‍💼 Employee Management</h1>
            <p>Update employee information</p>
        </div>

        <button class="theme-btn" onclick="toggleTheme()">
            🌙 Theme
        </button>
    </div>

    <!-- Update Form -->
    <div class="form-container">

        <h2>✏️ Update Employee Info</h2>

        <form method="POST">

            {% csrf_token %}

            <div class="form-group">
                <label for="name">Full Name</label>
                <input
                    type="text"
                    id="name"
                    name="name"
                    value="{{ employee.name }}"
                    required
                >
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    value="{{ employee.email }}"
                    required
                >
            </div>

            <div class="form-group">
                <label for="age">Age</label>
                <input
                    type="number"
                    id="age"
                    name="age"
                    value="{{ employee.age }}"
                    required
                >
            </div>

            <button type="submit" class="btn-submit">
                ✏️ Update Employee
            </button>

        </form>

        <a href="{% url 'home' %}" class="back-link">
            ← Cancel and Go Back
        </a>

    </div>

</div>

<script>

    // Dark / Light Theme
    function toggleTheme() {

        document.body.classList.toggle("dark");

        if (document.body.classList.contains("dark")) {

            localStorage.setItem("theme", "dark");

        } else {

            localStorage.setItem("theme", "light");

        }
    }

    // Remember selected theme
    window.onload = function() {

        if (localStorage.getItem("theme") === "dark") {

            document.body.classList.add("dark");

        }

    };

</script>

</body>
</html>
